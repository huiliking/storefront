fragment MenuItem on MenuItem {
	id
	name
	level
	translation(languageCode: $languageCode) {
		name
	}
	category {
		id
		slug
		name
		translation(languageCode: $languageCode) {
			name
		}
		# URL slug follows the market locale (URL), not the display language.
		marketTranslation: translation(languageCode: $marketLanguageCode) {
			slug
		}
	}
	collection {
		id
		name
		slug
		translation(languageCode: $languageCode) {
			name
		}
		# URL slug follows the market locale (URL), not the display language.
		marketTranslation: translation(languageCode: $marketLanguageCode) {
			slug
		}
	}
	page {
		id
		title
		slug
		translation(languageCode: $languageCode) {
			title
		}
		# URL slug follows the market locale (URL), not the display language.
		marketTranslation: translation(languageCode: $marketLanguageCode) {
			slug
		}
	}
	url
}

query MenuGetBySlug(
	$slug: String!
	$channel: String!
	$languageCode: LanguageCodeEnum!
	$marketLanguageCode: LanguageCodeEnum!
) {
	menu(slug: $slug, channel: $channel) {
		items {
			...MenuItem
			children {
				...MenuItem
				children {
					...MenuItem
				}
			}
		}
	}
}
